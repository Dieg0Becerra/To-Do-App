<!DOCTYPE html>

<html>
    <head>
        <meta charset = "UTF-8">
        <title>Todo by africa</title>
        <link rel = "stylesheet" href = "css/style.css">
    </head>
    <body>

        <header id = "top-bar">
            <h2> To dos</h2>

            <div id = "auth-buttons">
                <button id = "login-btn">Login</button>
                <button id = "logout-btn">Logout</button>

            </div>
        </header>

        <main class = "container">

            <div id = "controls-bar">
                <select id = "sort-select">
                    <option value = "sort-id" selected>By Order Added</option>
                    <option value = "sort-priority">By Priority</option>
                    <option value = "sort-date">By Date</option>
                </select>

                <div class = "checkbox-field">
                    <input type = "checkbox" id = "filter-timeframe">
                    <label for = "filter-timeframe">Filter by Timeframe</label>
                </div>
            </div>

            <div id = "lists">
                <ul id = "list"></ul>
                <ul id = "short-list"></ul>
                <ul id = "long-list"></ul>
            </div>

            <button id = "popup-btn">+ Add Task</button>

            <div id = "window" style = "display:none">
                <h3>New Task</h3>
                <input type = "text" id = "todo-input" placeholder = "Task...">
                <input type = "date" id = "due-date">
                <select id = "time-frame">
                    <option value = "Short term">Short term</option>
                    <option value = "Long term">Long term</option>
                </select>

                <label for = "priority">Priority</label>
                <input type = "number" id = "priority" min = "1" max = "5">

                <div class = "window-actions">
                    <button id = "cancel-btn">Cancel</button>
                    <button id = "add-btn">Add</button>
                </div>

            </div>

            <section id = "completed-section">
                <h3>Completed</h3>
                <ul id = "completed-list"></ul>
            </section>

        </main>

        <script type="module" src = "js/app.js"></script>
    </body>

</html>
